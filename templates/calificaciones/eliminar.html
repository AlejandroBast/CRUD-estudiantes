{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="bi bi-trash me-2"></i>Eliminar Calificación</h5>
      </div>
      <div class="card-body text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
        <p>¿Está seguro de eliminar el registro de:</p>
        <h5 class="fw-bold">{{ calificacion.nombre_estudiante }}</h5>
        <p class="text-muted">{{ calificacion.asignatura }} — Promedio: {{ calificacion.promedio }}</p>
        <form method="post" class="d-flex justify-content-center gap-2 mt-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Sí, eliminar
          </button>
          <a href="{% url 'listar' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i>Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
