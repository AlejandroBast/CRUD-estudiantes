<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluaciones Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #1565c0); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .btn-primary { background-color: #1565c0; border-color: #1565c0; }
        .table thead { background-color: #1a237e; color: white; }
        .badge-promedio { background-color: #1565c0; font-size: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'listar' %}">
      <i class="bi bi-mortarboard-fill me-2"></i>Evaluaciones Estudiantes
    </a>
    <div>
      <a href="{% url 'listar' %}" class="btn btn-outline-light btn-sm me-2">
        <i class="bi bi-list-ul me-1"></i>Listado
      </a>
      <a href="{% url 'crear' %}" class="btn btn-light btn-sm me-2">
        <i class="bi bi-plus-circle me-1"></i>Nueva
      </a>
      <a href="{% url 'promedio_general' %}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-bar-chart me-1"></i>Promedio General
      </a>
    </div>
  </div>
</nav>
<div class="container">
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
